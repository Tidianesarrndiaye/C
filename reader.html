<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur de cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --paper:#f2f4f7;
    --paper-2:#e9edf2;
    --card:#fbfcfd;
    --rule:#ccd5e0;
    --rule-strong:#aab6c4;
    --ink:#1b2330;
    --ink-muted:#586475;
    --ink-faint:#8894a2;
    --accent:#1f6e86;
    --accent-soft:#dbe9ec;
    --code-bg:#161c26;
    --code-ink:#dfe5ea;
    --code-accent:#6fd6ce;
    --shadow:0 1px 1px rgba(20,28,40,.05), 0 6px 18px -10px rgba(20,28,40,.28);
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --mono:'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --grid-op: .05;
    --lamp-on: 1;
    --lamp-shade: #56657a; --lamp-rim: #8894a2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12151c; --paper-2:#0d0f15; --card:#181d27;
      --rule:#262d3a; --rule-strong:#3a4353;
      --ink:#e6e9ee; --ink-muted:#9aa5b3; --ink-faint:#606c7c;
      --accent:#3fd6ce; --accent-soft:#1b3838;
      --code-bg:#0a0d13; --code-ink:#dde3e8; --code-accent:#7fe0d8;
      --shadow:0 1px 1px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
      --grid-op: .08;
      --lamp-on: 0;
      --lamp-shade: #323a48; --lamp-rim: #424b5b;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12151c; --paper-2:#0d0f15; --card:#181d27;
    --rule:#262d3a; --rule-strong:#3a4353;
    --ink:#e6e9ee; --ink-muted:#9aa5b3; --ink-faint:#606c7c;
    --accent:#3fd6ce; --accent-soft:#1b3838;
    --code-bg:#0a0d13; --code-ink:#dde3e8; --code-accent:#7fe0d8;
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
    --grid-op: .08;
    --lamp-on: 0;
    --lamp-shade: #323a48; --lamp-rim: #424b5b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;}
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:inherit; background-size:inherit; background-position:inherit;
    opacity:var(--grid-op);
    pointer-events:none;
  }
  body > .shell{position:relative;}
  body > *:not(.shell){ }

  .shell{
    --rail-w:288px;
    display:grid;
    grid-template-columns:var(--rail-w) minmax(0,1fr);
    min-height:100vh;
    transition:grid-template-columns .22s ease;
  }
  body.rail-collapsed .shell{--rail-w:0px; grid-template-columns:minmax(0,1fr);}

  /* ---------- Module bar (n'apparaît que si plusieurs cours sont détectés) ---------- */
  .module-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:20px 48px 0;
  }
  .module-pill{
    font-family:var(--serif);
    font-size:13.5px;
    font-style:italic;
    color:var(--ink-muted);
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:6px 14px;
    cursor:pointer;
  }
  .module-pill:hover{color:var(--accent); border-color:var(--accent);}
  .module-pill.active{
    color:var(--accent);
    border-color:var(--accent);
    background:var(--accent-soft);
    font-weight:600;
  }
  @media (max-width:860px){
    .module-bar{padding:16px 20px 0;}
  }

  /* ---------- Reading column ---------- */
  main{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    position:sticky; top:0; z-index:1;
    display:flex;
    align-items:center;
    gap:14px;
    height:62px;
    padding:0 48px;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    transition:padding-left .22s ease;
  }
  body.rail-collapsed .topbar{padding-left:68px;}
  .topbar .course-name{
    font-family:var(--serif);
    font-size:15px;
    font-style:italic;
    color:var(--ink-muted);
  }
  /* Interrupteur à cordon (lampe de chevet) : on tire, la chaîne s'étire et rebondit */
  .theme-toggle{
    margin-left:auto;
    align-self:flex-start;
    position:relative;
    width:46px; height:62px;
    padding:0;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-muted);
    -webkit-tap-highlight-color:transparent;
  }
  .theme-toggle svg{display:block; width:46px; height:62px; overflow:visible; transform-origin:50% 0;}
  .theme-toggle .chain{
    stroke:currentColor; stroke-width:3.6; stroke-linecap:round; fill:none;
    stroke-dasharray:.1 5.2;
    transform-box:fill-box; transform-origin:50% 0;
  }
  .theme-toggle .pull{fill:var(--accent); stroke:var(--card); stroke-width:1.2;}
  .theme-toggle .pull-ring{fill:none; stroke:var(--card); stroke-width:1.4; opacity:.7;}
  .theme-toggle:hover{color:var(--accent);}
  .theme-toggle:hover .pull{filter:brightness(1.12);}
  .theme-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
  .theme-toggle.pulled svg{animation:cord-swing .85s cubic-bezier(.3,.7,.4,1) both;}
  .theme-toggle.pulled .chain{animation:cord-stretch .85s cubic-bezier(.3,.7,.4,1) both;}
  .theme-toggle.pulled .handle{animation:handle-drop .85s cubic-bezier(.3,.7,.4,1) both;}
  @keyframes cord-stretch{
    0%{transform:scaleY(1)} 22%{transform:scaleY(1.7)} 48%{transform:scaleY(.88)}
    68%{transform:scaleY(1.12)} 84%{transform:scaleY(.98)} 100%{transform:scaleY(1)}
  }
  @keyframes handle-drop{
    0%{transform:translateY(0)} 22%{transform:translateY(12.6px)} 48%{transform:translateY(-2.2px)}
    68%{transform:translateY(2.2px)} 84%{transform:translateY(-.4px)} 100%{transform:translateY(0)}
  }
  @keyframes bulb-flick{
    0%,100%{filter:none} 30%{filter:brightness(.7)} 45%{filter:brightness(1.25)} 60%{filter:brightness(.9)}
  }
  .lamp-shade{fill:var(--lamp-shade);}
  .lamp-rim{fill:var(--lamp-rim);}
  .bulb-off{fill:var(--rule-strong);}
  .bulb-on{fill:#ffd24d; opacity:var(--lamp-on);}
  .lamp-glow{fill:url(#lampGlow); opacity:var(--lamp-on);}
  .lamp-cone{fill:url(#lampCone); opacity:calc(var(--lamp-on) * .9);}
  .theme-toggle.pulled .bulb-on{animation:bulb-flick .85s ease both;}
  @keyframes cord-swing{
    0%{transform:rotate(0)} 22%{transform:rotate(5deg)} 48%{transform:rotate(-4deg)}
    68%{transform:rotate(2.5deg)} 84%{transform:rotate(-1deg)} 100%{transform:rotate(0)}
  }
  /* fondu doux des couleurs pendant le changement de thème */
  html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
    transition:background-color .35s ease, color .35s ease, border-color .35s ease, fill .35s ease, opacity .35s ease !important;
  }
  @media (prefers-reduced-motion:reduce){
    .theme-toggle.pulled svg, .theme-toggle.pulled .chain, .theme-toggle.pulled .handle{animation:none;}
  }

  .reader{
    flex:1;
    padding:10px 48px 60px;
  }
  article{
    max-width:940px;
  }
  body.rail-collapsed article{margin:0 auto;}
  .chap-head{
    display:flex;
    align-items:flex-start;
    gap:22px;
    margin-bottom:38px;
    border-bottom:1px solid var(--rule-strong);
    padding-bottom:26px;
  }
  .chap-folio{
    font-family:var(--mono);
    font-size:52px;
    font-weight:500;
    line-height:1;
    color:var(--ink-faint);
    letter-spacing:-.02em;
    padding-top:6px;
  }
  article h1.chap-title{
    font-family:var(--serif);
    font-size:clamp(28px,3.6vw,38px);
    font-weight:600;
    line-height:1.18;
    margin:0;
    text-wrap:balance;
    flex:1;
  }

  .prose{
    font-size:18px;
    line-height:1.75;
    color:var(--ink);
    max-width:84ch;
  }
  .prose h2{
    font-family:var(--serif);
    font-weight:600;
    font-style:italic;
    font-size:23px;
    margin:38px 0 12px;
    color:var(--ink);
  }
  .prose h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:18px;
    margin:26px 0 8px;
  }
  .prose p{margin:0 0 16px;}
  .prose ul, .prose ol{margin:0 0 16px;padding-left:24px;}
  .prose li{margin:0 0 8px;}
  .prose li>ul, .prose li>ol{margin-top:8px;}
  .prose strong{font-weight:600;}
  .prose a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px;}
  .prose a:hover{text-decoration-color:var(--accent); color:var(--accent);}
  .prose code{
    font-family:var(--mono);
    font-size:.82em;
    background:var(--paper-2);
    padding:.1em .35em;
    border-radius:3px;
    color:var(--ink);
    border:1px solid var(--rule);
  }
  .prose hr{border:none;border-top:1px solid var(--rule);margin:34px 0;}

  .prose blockquote{
    margin:22px 0;
    padding:4px 0 4px 20px;
    border-left:2px solid var(--accent);
    font-style:italic;
    color:var(--ink-muted);
    font-size:16.5px;
  }
  .prose blockquote p{margin:0;}
  .prose blockquote p+p{margin-top:8px;}

  .code-wrap{
    position:relative;
    margin:22px 0;
    border-radius:3px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .code-wrap .lang{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.04em;
    color:var(--code-accent);
    background:var(--code-bg);
    padding:8px 16px 0;
    opacity:.65;
  }
  .code-wrap .copy{
    position:absolute;
    top:6px; right:8px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--code-ink);
    background:transparent;
    border:1px solid rgba(255,255,255,.14);
    border-radius:3px;
    padding:3px 9px;
    cursor:pointer;
    opacity:.55;
    transition:opacity .15s, color .15s, border-color .15s;
  }
  .code-wrap:hover .copy, .code-wrap .copy:focus-visible{opacity:1;}
  .code-wrap .copy:hover{color:var(--code-accent);border-color:var(--code-accent);}
  .code-wrap .copy.ok{opacity:1;color:var(--code-accent);border-color:var(--code-accent);}
  .code-wrap:not(:has(.lang)) pre{padding-top:34px;}
  .prose pre{
    margin:0;
    background:var(--code-bg);
    color:var(--code-ink);
    padding:16px 18px 18px;
    overflow-x:auto;
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.65;
  }
  .prose pre code{background:none;border:none;padding:0;color:inherit;font-size:inherit;}

  .table-wrap{margin:22px 0;overflow-x:auto;}
  .prose table{border-collapse:collapse;width:100%;font-family:var(--serif);font-size:15.5px;}
  .prose th{
    text-align:left;
    font-weight:600;
    font-style:italic;
    color:var(--ink-muted);
    padding:8px 16px 8px 0;
    border-bottom:1px solid var(--rule-strong);
    white-space:nowrap;
  }
  .prose td{
    padding:9px 16px 9px 0;
    border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  .prose tr:last-child td{border-bottom:1px solid var(--rule-strong);}

  .done-row{
    max-width:940px;
    margin-top:34px;
  }
  .done-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--rule-strong);
    border-radius:20px;
    padding:9px 18px 9px 14px;
    cursor:pointer;
    font-family:var(--serif);
    font-size:14.5px;
    font-style:italic;
    color:var(--ink-muted);
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .done-btn:hover{border-color:var(--accent); color:var(--accent);}
  .done-btn .done-mark{
    width:15px; height:15px; border-radius:50%;
    border:1.5px solid var(--rule-strong);
    flex:none;
    position:relative;
  }
  .done-btn:hover .done-mark{border-color:var(--accent);}
  .done-row.done .done-btn{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .done-row.done .done-btn .done-mark{
    background:var(--accent);
    border-color:var(--accent);
  }
  .done-row.done .done-btn .done-mark::after{
    content:"";
    position:absolute; left:3px; top:0px;
    width:4px; height:8px;
    border-right:1.5px solid var(--card);
    border-bottom:1.5px solid var(--card);
    transform:rotate(45deg);
  }

  .foot-nav{
    max-width:940px;
    margin:52px 0 0;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    padding-top:22px;
    border-top:1px solid var(--rule-strong);
  }
  .nav-btn{
    display:flex;
    flex-direction:column;
    gap:5px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    padding:0;
    max-width:280px;
  }
  .nav-btn.next{align-items:flex-end;text-align:right;margin-left:auto;}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;}
  .nav-btn .dir{
    font-family:var(--serif);
    font-style:italic;
    font-size:13.5px;
    color:var(--accent);
  }
  .nav-btn .label{
    font-size:16px;
    font-weight:500;
    line-height:1.35;
    border-bottom:1px solid transparent;
  }
  .nav-btn:hover:not(:disabled) .label{border-bottom-color:var(--ink);}

  .empty, .loading, .error{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-muted);padding:20px 0;}
  .error{color:var(--accent);}

  /* ---------- Sidebar (sommaire repliable, à gauche) ---------- */
  .tabrail{
    position:sticky; top:0;
    height:100vh;
    width:var(--rail-w);
    overflow:hidden;
    background:var(--card);
    border-right:1px solid var(--rule-strong);
    display:flex;
    flex-direction:column;
    transition:width .22s ease;
    z-index:2;
  }
  /* Replié (ou téléphone) : le panneau flotte au-dessus du contenu, glissé hors écran ;
     il apparaît en aperçu (survol du bouton) ou ouvert (clic / tiroir mobile). */
  body.rail-collapsed .tabrail{
    position:fixed; top:0; left:0; width:288px;
    transform:translateX(-102%);
    transition:transform .2s ease, box-shadow .2s ease;
    z-index:5;
  }
  body.rail-collapsed .tabrail.open{
    transform:translateX(0);
    box-shadow:0 10px 40px -8px rgba(0,0,0,.45);
  }
  .rail-inner{
    width:288px;
    height:100%;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .rail-head{
    display:flex;
    align-items:center;
    gap:10px;
    height:62px;
    padding:0 18px 0 68px;   /* laisse la place au bouton fixe en haut à gauche */
    flex:none;
  }
  .rail-title{
    flex:1;
    min-width:0;
    font-family:var(--serif);
    font-size:15px;
    font-weight:600;
    line-height:1.25;
    color:var(--ink);
  }
  .rail-sub{
    display:block;
    font-style:italic;
    font-weight:400;
    font-size:12.5px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .icon-btn{
    flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    background:none;
    border:1px solid transparent;
    border-radius:8px;
    color:var(--ink-muted);
    cursor:pointer;
    padding:0;
  }
  .icon-btn:hover{background:var(--paper-2); color:var(--accent);}
  .icon-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  #tabs{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:4px 10px 12px;
    scrollbar-width:thin;
  }
  .tab{
    display:flex;
    align-items:baseline;
    gap:10px;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin:0 0 2px;
    background:none;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-family:var(--serif);
    color:var(--ink-muted);
  }
  .tab:hover{background:var(--paper-2); color:var(--ink);}
  .tab .num{
    flex:none;
    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
    color:var(--ink-faint);
    min-width:20px;
  }
  .tab .name{
    flex:1;
    min-width:0;
    font-size:15px;
    line-height:1.35;
  }
  .tab .dot{
    flex:none;
    align-self:center;
    width:7px; height:7px; border-radius:50%;
    border:1.3px solid var(--rule-strong);
  }
  .tab.read .dot{background:var(--accent); border-color:var(--accent);}
  .tab.active{background:var(--accent-soft); color:var(--ink);}
  .tab.active .num{color:var(--accent); font-weight:600;}
  .tab.active .name{font-weight:600;}
  .tab.active .dot{border-color:var(--accent);}
  .rail-foot{
    padding:12px 18px 16px;
    border-top:1px solid var(--rule);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
  }
  .menu-toggle{
    position:fixed; top:14px; left:14px;
    z-index:6;
    width:36px; height:36px;
  }
  .rail-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,13,18,.45);
    z-index:4;
  }

  @media (max-width:860px){
    .shell{grid-template-columns:minmax(0,1fr);}
    .tabrail{
      position:fixed; top:0; left:0; width:min(84vw,300px);
      transform:translateX(-102%);
      transition:transform .22s ease;
      z-index:5;
      box-shadow:none;
    }
    .tabrail.open{transform:translateX(0); box-shadow:0 10px 40px -8px rgba(0,0,0,.45);}
    .topbar{padding-left:62px !important;}
    .rail-backdrop.open{display:block;}
    .rail-inner{width:100%;}
    .topbar{padding-right:20px;}
    .reader{padding-left:20px; padding-right:20px;}
    .chap-folio{font-size:34px;}
  }
  @media (prefers-reduced-motion:reduce){ .shell, .tabrail{transition:none;} }
</style>
</head>
<body>

<div class="module-bar" id="module-bar" style="display:none;"></div>
<button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Afficher le sommaire" aria-expanded="true" title="Sommaire">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
</button>
<div class="shell">
  <aside class="tabrail" id="tabrail" aria-label="Sommaire">
    <div class="rail-inner">
      <div class="rail-head">
        <div class="rail-title"><span id="rail-course">Cours</span><span class="rail-sub" id="rail-head"></span></div>
      </div>
      <div id="tabs"></div>
      <div class="rail-foot" id="rail-foot"></div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <span class="course-name" id="course-name">Chargement…</span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Changer de thème (clair / sombre)" title="Tirer pour changer de thème">
        <svg viewBox="0 0 46 62" aria-hidden="true">
          <defs>
            <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ffd24d" stop-opacity=".95"/>
              <stop offset=".45" stop-color="#ffd24d" stop-opacity=".35"/>
              <stop offset="1" stop-color="#ffd24d" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="lampCone" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd24d" stop-opacity=".38"/>
              <stop offset="1" stop-color="#ffd24d" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path class="lamp-cone" d="M17 22 L29 22 L41 62 L5 62 Z"/>
          <circle class="lamp-glow" cx="23" cy="22" r="20"/>
          <rect class="lamp-rim" x="21" y="-4" width="4" height="6" rx="1"/>
          <path class="lamp-shade" d="M9 20 Q9 3 23 3 Q37 3 37 20 Z"/>
          <rect class="lamp-rim" x="7" y="19" width="32" height="3" rx="1.5"/>
          <circle class="bulb-off" cx="23" cy="25.5" r="4.2"/>
          <circle class="bulb-on" cx="23" cy="25.5" r="4.2"/>
          <path class="chain" d="M23 30V47"/>
          <g class="handle">
            <rect class="pull" x="17.5" y="48" width="11" height="13" rx="5.5"/>
            <path class="pull-ring" d="M20 52.5h6M20 56.5h6"/>
          </g>
        </svg>
      </button>
    </div>
    <div class="reader">
      <article>
        <div class="chap-head">
          <div class="chap-folio" id="chap-folio">–</div>
          <h1 class="chap-title" id="chap-title">Chargement du sommaire…</h1>
        </div>
        <div class="prose" id="chap-body"></div>
        <div class="done-row" id="done-row" style="display:none;">
          <button class="done-btn" id="btn-done" type="button">
            <span class="done-mark"></span>
            <span class="done-label" id="done-label">marquer comme terminé</span>
          </button>
        </div>
        <div class="foot-nav" id="foot-nav" style="display:none;">
          <button class="nav-btn prev" id="btn-prev" type="button">
            <span class="dir">précédent</span>
            <span class="label" id="prev-label"></span>
          </button>
          <button class="nav-btn next" id="btn-next" type="button">
            <span class="dir">suivant</span>
            <span class="label" id="next-label"></span>
          </button>
        </div>
      </article>
    </div>
  </main>

</div>
<div class="rail-backdrop" id="rail-backdrop"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var THEME_KEY = 'md-reader-theme';
  var LAST_MODULE_KEY = 'md-reader-last-module';

  var elModuleBar = document.getElementById('module-bar');
  var elTabs = document.getElementById('tabs');
  var elTitle = document.getElementById('chap-title');
  var elFolio = document.getElementById('chap-folio');
  var elBody = document.getElementById('chap-body');
  var elCourseName = document.getElementById('course-name');
  var elRailHead = document.getElementById('rail-head');
  var elRailCourse = document.getElementById('rail-course');
  var elRailFoot = document.getElementById('rail-foot');
  var footNav = document.getElementById('foot-nav');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var prevLabel = document.getElementById('prev-label');
  var nextLabel = document.getElementById('next-label');
  var doneRow = document.getElementById('done-row');
  var btnDone = document.getElementById('btn-done');
  var doneLabel = document.getElementById('done-label');

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {current:0, read:[]};
      var s = JSON.parse(raw);
      return {current: s.current||0, read: s.read||[]};
    }catch(e){ return {current:0, read:[]}; }
  }
  function saveState(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
  // Le module actif n'est connu qu'après la découverte (voir plus bas) : l'état réel
  // n'est chargé qu'à ce moment-là, une fois STORE_KEY calculée pour ce module.
  var state = {current:0, read:[]};

  marked.setOptions({ gfm:true, breaks:false });

  function renderMarkdown(md, baseFile){
    var html = marked.parse(md);
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    wrap.querySelectorAll('table').forEach(function(t){
      var d = document.createElement('div');
      d.className = 'table-wrap';
      t.parentNode.insertBefore(d, t);
      d.appendChild(t);
    });
    wrap.querySelectorAll('pre').forEach(function(pre){
      var code = pre.querySelector('code');
      var lang = '';
      if(code && code.className){
        var m = code.className.match(/language-(\w+)/);
        if(m) lang = m[1];
      }
      var d = document.createElement('div');
      d.className = 'code-wrap';
      pre.parentNode.insertBefore(d, pre);
      if(lang){
        var l = document.createElement('div');
        l.className = 'lang';
        l.textContent = lang;
        d.appendChild(l);
      }
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'copy';
      c.textContent = 'copier';
      c.setAttribute('aria-label', 'Copier le code');
      d.appendChild(c);
      d.appendChild(pre);
    });
    // Les liens relatifs des .md sont écrits par rapport au dossier du chapitre
    // (ex. 02-....md, reference/), alors que reader.html vit à la racine du dépôt :
    // tels quels, ils pointeraient vers /02-....md → 404. On les résout donc depuis
    // le dossier du fichier ; un lien vers un chapitre du module ouvre ce chapitre
    // dans le lecteur (data-chapter, intercepté plus bas) au lieu du .md brut.
    if(baseFile){
      var base = new URL(baseFile, location.href);
      wrap.querySelectorAll('a[href]').forEach(function(a){
        var href = a.getAttribute('href');
        if(/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(href)) return;
        var url = new URL(href, base);
        a.setAttribute('href', url.pathname + url.search + url.hash);
        var path = decodeURIComponent(url.pathname);
        for(var i = 0; i < chapters.length; i++){
          if(new URL(chapters[i].file, location.href).pathname === url.pathname
             || '/' + chapters[i].file === path){
            a.setAttribute('data-chapter', i);
            break;
          }
        }
      });
    }
    return wrap.innerHTML;
  }

  function splitChapter(raw){
    var lines = raw.replace(/\r\n/g, '\n').split('\n');
    var h1 = '';
    if(lines.length && /^#\s+/.test(lines[0])){
      h1 = lines.shift().replace(/^#\s+/, '').trim();
    }
    while(lines.length && lines[0].trim() === '') lines.shift();
    var body = lines.join('\n');
    var navSplit = body.lastIndexOf('\n---\n');
    if(navSplit !== -1) body = body.slice(0, navSplit);
    return { title: h1, body: body.trim() + '\n' };
  }

  function parseTitle(h1, fallbackNum){
    var m = h1.match(/^(\d+)\s*[—\-:]\s*(.+)$/);
    if(m) return { num: m[1], title: m[2] };
    return { num: fallbackNum, title: h1 };
  }

  function listDir(path){
    return fetch(path)
      .then(function(res){
        if(!res.ok) throw new Error('directory listing HTTP ' + res.status);
        return res.text();
      })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        return Array.prototype.slice.call(doc.querySelectorAll('a[href]'))
          .map(function(a){ return decodeURIComponent(a.getAttribute('href')); });
      });
  }

  function sortByLeadingNumber(list){
    return list.slice().sort(function(a, b){
      var na = parseInt(a.match(/^(\d+)/)[1], 10);
      var nb = parseInt(b.match(/^(\d+)/)[1], 10);
      return na - nb;
    });
  }

  // Un module de cours est n'importe quel dossier à la racine du dépôt qui contient
  // au moins un chapitre numéroté (NN-slug.md) — c'est ce qui permet à un futur module
  // (02-..., 03-...) d'apparaître ici sans toucher à ce lecteur.
  function discoverModules(){
    return listDir('./').then(function(entries){
      var folders = entries
        .filter(function(href){ return /^[^\/?#.][^\/?#]*\/$/.test(href); })
        .map(function(href){ return href.replace(/\/$/, ''); });
      return Promise.all(folders.map(function(folder){
        return listDir('./' + encodeURIComponent(folder) + '/')
          .then(function(files){
            return files.some(function(f){ return /^\d+-[^\/]+\.md$/i.test(f); }) ? folder : null;
          })
          .catch(function(){ return null; });
      })).then(function(results){ return results.filter(Boolean).sort(); });
    });
  }

  function discoverChapters(module){
    return listDir('./' + encodeURIComponent(module) + '/').then(function(entries){
      var files = entries.filter(function(href){ return /^\d+-[^\/]+\.md$/i.test(href); });
      return sortByLeadingNumber(files);
    });
  }

  function loadCourseTitle(module){
    return fetch('./' + encodeURIComponent(module) + '/README.md')
      .then(function(res){ return res.ok ? res.text() : ''; })
      .then(function(md){
        var m = md.match(/^#\s+(.+)$/m);
        return m ? m[1].trim() : '';
      })
      .catch(function(){ return ''; });
  }

  var chapters = [];
  var currentModule = '';
  var STORE_KEY = '';

  function buildTabs(){
    elTabs.innerHTML = '';
    chapters.forEach(function(ch, i){
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.dataset.idx = i;
      btn.title = ch.title;
      btn.innerHTML = '<span class="num"></span><span class="name"></span><span class="dot"></span>';
      btn.querySelector('.num').textContent = ch.num;
      btn.querySelector('.name').textContent = ch.title;
      btn.addEventListener('click', function(){ goTo(i); });
      elTabs.appendChild(btn);
    });
  }

  function updateTabsUI(){
    elTabs.querySelectorAll('.tab').forEach(function(el){
      var i = Number(el.dataset.idx);
      el.classList.toggle('active', i === state.current);
      el.classList.toggle('read', state.read.indexOf(i) !== -1);
      if(i === state.current && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
    });
  }

  function updateDoneUI(){
    var isDone = state.read.indexOf(state.current) !== -1;
    doneRow.classList.toggle('done', isDone);
    doneLabel.textContent = isDone ? 'chapitre terminé' : 'marquer comme terminé';
  }

  function toggleDone(){
    var i = state.current;
    var pos = state.read.indexOf(i);
    if(pos === -1) state.read.push(i);
    else state.read.splice(pos, 1);
    saveState(state);
    updateDoneUI();
    updateTabsUI();
    elRailFoot.textContent = state.read.length + ' / ' + chapters.length + ' lus';
  }

  function ensureLoaded(i){
    var ch = chapters[i];
    if(ch.loaded) return Promise.resolve(ch);
    return fetch(ch.file)
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(raw){
        var split = splitChapter(raw);
        var parsed = parseTitle(split.title, ch.num);
        ch.title = parsed.title;
        ch.body = split.body;
        ch.loaded = true;
        return ch;
      });
  }

  function render(i){
    var ch = chapters[i];
    elFolio.textContent = ch.num;
    elTitle.textContent = 'Chargement…';
    elBody.innerHTML = '<div class="loading">chargement du chapitre…</div>';

    ensureLoaded(i).then(function(){
      var tab = elTabs.querySelector('.tab[data-idx="'+i+'"]');
      if(tab){ tab.title = ch.title; var nm = tab.querySelector('.name'); if(nm) nm.textContent = ch.title; }

      elTitle.textContent = ch.title;
      elBody.innerHTML = renderMarkdown(ch.body, ch.file);

      footNav.style.display = 'flex';
      doneRow.style.display = 'block';
      btnPrev.disabled = i === 0;
      btnNext.disabled = i === chapters.length - 1;
      prevLabel.textContent = i > 0 ? (chapters[i-1].num + ' — ' + chapters[i-1].title) : '';
      nextLabel.textContent = i < chapters.length - 1 ? (chapters[i+1].num + ' — ' + chapters[i+1].title) : 'fin du module';

      updateDoneUI();
      updateTabsUI();
      saveState(state);
      elRailFoot.textContent = state.read.length + ' / ' + chapters.length + ' lus';
      window.scrollTo(0,0);
    }).catch(function(err){
      elTitle.textContent = ch.num + ' — erreur de chargement';
      elBody.innerHTML = '<div class="error">impossible de charger '+ch.file+' (' + err.message + ')</div>';
    });
  }

  var tabrail = document.getElementById('tabrail');
  var railBackdrop = document.getElementById('rail-backdrop');
  var menuToggle = document.getElementById('menu-toggle');

  var RAIL_KEY = 'md-reader-rail-collapsed';
  var mobileMq = window.matchMedia('(max-width:860px)');
  var hoverMq = window.matchMedia('(hover:hover)');
  var peekTimer = null;
  var suppressPeek = false;

  function isCollapsed(){ return document.body.classList.contains('rail-collapsed'); }
  function setCollapsed(c, persist){
    document.body.classList.toggle('rail-collapsed', c);
    tabrail.classList.remove('open');
    railBackdrop.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', c ? 'false' : 'true');
    menuToggle.title = c ? 'Afficher le sommaire' : 'Masquer le sommaire';
    if(persist){ try{ localStorage.setItem(RAIL_KEY, c ? '1' : '0'); }catch(e){} }
  }
  function openRail(){
    clearTimeout(peekTimer);
    tabrail.classList.add('open');
    if(mobileMq.matches) railBackdrop.classList.add('open');
  }
  function closeRail(){
    clearTimeout(peekTimer);
    tabrail.classList.remove('open');
    railBackdrop.classList.remove('open');
  }
  function scheduleClose(){
    clearTimeout(peekTimer);
    peekTimer = setTimeout(closeRail, 220);
  }
  // Sur téléphone le panneau est toujours un tiroir, quel que soit l'état mémorisé.
  function syncMode(){
    if(mobileMq.matches){ document.body.classList.add('rail-collapsed'); closeRail(); }
    else { var saved = null; try{ saved = localStorage.getItem(RAIL_KEY); }catch(e){} setCollapsed(saved === '1', false); }
  }
  syncMode();
  if(mobileMq.addEventListener) mobileMq.addEventListener('change', syncMode);

  menuToggle.addEventListener('click', function(){
    if(mobileMq.matches){ tabrail.classList.contains('open') ? closeRail() : openRail(); return; }
    if(isCollapsed()){ setCollapsed(false, true); }                 // épingler : le panneau pousse le contenu
    else { setCollapsed(true, true); suppressPeek = true; }         // replier (sans ré-aperçu tant que la souris reste dessus)
  });
  // Aperçu au survol, comme claude.ai : le panneau flotte tant que la souris est sur le bouton ou sur lui.
  menuToggle.addEventListener('mouseenter', function(){
    if(!mobileMq.matches && hoverMq.matches && isCollapsed() && !suppressPeek) openRail();
  });
  menuToggle.addEventListener('mouseleave', function(){
    suppressPeek = false;
    if(!mobileMq.matches && isCollapsed()) scheduleClose();
  });
  tabrail.addEventListener('mouseenter', function(){ if(isCollapsed()) clearTimeout(peekTimer); });
  tabrail.addEventListener('mouseleave', function(){ if(!mobileMq.matches && isCollapsed()) scheduleClose(); });
  railBackdrop.addEventListener('click', closeRail);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeRail(); });

  function goTo(i){
    if(i < 0 || i >= chapters.length) return;
    state.current = i;
    render(i);
    if(isCollapsed()) closeRail();
  }

  // navigator.clipboard n'existe qu'en contexte sécurisé (localhost/HTTPS) : ouvert depuis
  // un autre appareil du réseau (http://192.168.x.x:8329), on retombe sur execCommand.
  function copyText(text){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function(resolve, reject){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copie impossible'));
    });
  }

  elBody.addEventListener('click', function(e){
    var btn = e.target.closest('.code-wrap .copy');
    if(btn){
      var code = btn.parentNode.querySelector('pre');
      copyText(code.textContent.replace(/\n$/, '')).then(function(){
        btn.textContent = 'copié ✓';
        btn.classList.add('ok');
      }, function(){
        btn.textContent = 'échec';
      });
      clearTimeout(btn._t);
      btn._t = setTimeout(function(){ btn.textContent = 'copier'; btn.classList.remove('ok'); }, 1600);
      return;
    }
    var a = e.target.closest('a[data-chapter]');
    if(!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    goTo(+a.getAttribute('data-chapter'));
  });

  btnDone.addEventListener('click', toggleDone);
  btnPrev.addEventListener('click', function(){ goTo(state.current - 1); });
  btnNext.addEventListener('click', function(){ goTo(state.current + 1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') goTo(state.current + 1);
    if(e.key === 'ArrowLeft') goTo(state.current - 1);
  });

  var themeBtn = document.getElementById('theme-toggle');
  var darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(t){
    if(t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : darkMq.matches;
  }
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem(THEME_KEY); }catch(e){}
  if(savedTheme) applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    // petit « clic » de lampe : on rejoue l'animation de traction à chaque appui
    themeBtn.classList.remove('pulled'); void themeBtn.offsetWidth; themeBtn.classList.add('pulled');
    var root = document.documentElement;
    root.classList.add('theme-anim');
    clearTimeout(themeBtn._t); themeBtn._t = setTimeout(function(){ root.classList.remove('theme-anim'); }, 450);
    var next = isDark() ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });
  themeBtn.addEventListener('animationend', function(e){
    if(e.target === themeBtn.querySelector('svg')) themeBtn.classList.remove('pulled');
  });

  function getRequestedModule(){
    try{ return new URLSearchParams(location.search).get('m') || ''; }
    catch(e){ return ''; }
  }

  function prettyModuleName(folder){
    var s = folder.replace(/^\d+-/, '').replace(/-/g, ' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // La barre de modules ne s'affiche que s'il y a plusieurs cours à choisir : avec un
  // seul module (le cas aujourd'hui), le lecteur a exactement le même rendu qu'avant.
  function buildModuleSwitcher(modules, active){
    elModuleBar.innerHTML = '';
    if(modules.length < 2){ elModuleBar.style.display = 'none'; return; }
    elModuleBar.style.display = 'flex';
    modules.forEach(function(m){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'module-pill' + (m === active ? ' active' : '');
      btn.textContent = prettyModuleName(m);
      btn.addEventListener('click', function(){
        if(m !== active) location.href = 'reader.html?m=' + encodeURIComponent(m);
      });
      elModuleBar.appendChild(btn);
    });
  }

  discoverModules().then(function(modules){
    if(!modules.length){
      elRailHead.textContent = '—';
      elTitle.textContent = 'Aucun module trouvé';
      elBody.innerHTML = '<div class="empty">Aucun dossier avec des chapitres numérotés (NN-slug.md) à la racine du dépôt.</div>';
      return;
    }

    var requested = getRequestedModule();
    var last = null;
    try{ last = localStorage.getItem(LAST_MODULE_KEY); }catch(e){}
    currentModule = modules.indexOf(requested) !== -1 ? requested
      : (modules.indexOf(last) !== -1 ? last : modules[0]);
    try{ localStorage.setItem(LAST_MODULE_KEY, currentModule); }catch(e){}
    STORE_KEY = 'md-reader-progress::' + location.pathname + '::' + currentModule;
    state = loadState();
    buildModuleSwitcher(modules, currentModule);

    return Promise.all([discoverChapters(currentModule), loadCourseTitle(currentModule)]).then(function(results){
      var files = results[0];
      var courseTitle = results[1];

      if(!files.length){
        elTabs.innerHTML = '';
        elRailHead.textContent = '—';
        elTitle.textContent = 'Aucun chapitre trouvé';
        elBody.innerHTML = '<div class="empty">Aucun fichier .md numéroté dans ' + currentModule + '/.</div>';
        return;
      }

      chapters = files.map(function(file){
        var m = file.match(/^(\d+)-/);
        return { file: currentModule + '/' + file, num: m ? m[1] : '', title: file.replace(/\.md$/,''), body: '', loaded: false };
      });

      elCourseName.textContent = courseTitle || document.title;
      elRailCourse.textContent = courseTitle || document.title;
      elRailHead.textContent = chapters.length + ' chapitres';
      elRailFoot.textContent = (state.read.length) + ' lus';

      // Précharge tous les chapitres (fichiers courts) pour connaître leurs vrais titres
      // dès le départ — sinon le libellé "suivant"/"précédent" affiche le nom de fichier
      // brut tant que ce chapitre n'a pas été ouvert.
      return Promise.all(chapters.map(function(ch, i){ return ensureLoaded(i); })).then(function(){
        buildTabs();
        if(state.current >= chapters.length) state.current = 0;
        render(state.current);
      });
    });
  }).catch(function(err){
    elRailHead.textContent = 'erreur';
    elTitle.textContent = 'Erreur';
    elBody.innerHTML = '<div class="error">Impossible de lister le dépôt (' + err.message + ').<br><br>Ce lecteur a besoin d\'un serveur HTTP local (le listing de dossier). Lance-le depuis la racine du dépôt :<br><code>uv run python outils/serveur.py</code><br>puis ouvre <code>http://localhost:8329/reader.html</code>.</div>';
  });
})();
</script>
</body>
</html>
