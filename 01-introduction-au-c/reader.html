<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur de cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#eef2f4;
    --surface:#ffffff;
    --surface-2:#e5eaed;
    --ink:#14202b;
    --muted:#54697a;
    --muted-2:#7c8d9b;
    --accent:#0e7c86;
    --accent-soft:#dcf0ef;
    --amber:#a86a1f;
    --amber-soft:#f6ead2;
    --line:#d7dee2;
    --line-strong:#c1cbd1;
    --code-bg:#0f2027;
    --code-ink:#cfe9e6;
    --code-accent:#59d1c6;
    --shadow:0 1px 2px rgba(20,32,43,.06), 0 8px 24px -12px rgba(20,32,43,.18);
    --radius:10px;
    --serif:'IBM Plex Serif', Georgia, 'Times New Roman', serif;
    --sans:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    --mono:'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1418; --surface:#101c22; --surface-2:#16242b; --ink:#dde8ea;
      --muted:#93a7b3; --muted-2:#6d8390; --accent:#3fd6ce; --accent-soft:#123330;
      --amber:#e0a94a; --amber-soft:#2e2413; --line:#1f2f37; --line-strong:#2b3e47;
      --code-bg:#050d10; --code-ink:#bfe6e1; --code-accent:#59d1c6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1418; --surface:#101c22; --surface-2:#16242b; --ink:#dde8ea;
    --muted:#93a7b3; --muted-2:#6d8390; --accent:#3fd6ce; --accent-soft:#123330;
    --amber:#e0a94a; --amber-soft:#2e2413; --line:#1f2f37; --line-strong:#2b3e47;
    --code-bg:#050d10; --code-ink:#bfe6e1; --code-accent:#59d1c6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh;}
  .sidebar{background:var(--surface);border-right:1px solid var(--line);padding:28px 20px 20px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
  .brand h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;line-height:1.25;}
  .progress-track{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .25s ease;width:0%;}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--muted-2);display:flex;justify-content:space-between;}
  nav.toc{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
  .toc-item{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:transparent;text-align:left;font:inherit;color:var(--ink);width:100%;}
  .toc-item:hover{background:var(--surface-2);}
  .toc-item .n{font-family:var(--mono);font-size:12px;color:var(--muted-2);min-width:20px;}
  .toc-item .t{font-size:13.5px;line-height:1.35;color:var(--muted);}
  .toc-item.active{background:var(--accent-soft);border-color:var(--accent);}
  .toc-item.active .n{color:var(--accent);font-weight:600;}
  .toc-item.active .t{color:var(--ink);font-weight:600;}
  .toc-item .check{margin-left:auto;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;}
  .toc-item.read .check{background:var(--accent);border-color:var(--accent);}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted-2);line-height:1.6;word-break:break-all;}
  main{display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 40px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;}
  .topbar .crumb{font-family:var(--mono);font-size:12px;color:var(--muted-2);letter-spacing:.02em;}
  .topbar .crumb b{color:var(--accent);font-weight:600;}
  .theme-toggle{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;}
  .theme-toggle:hover{border-color:var(--line-strong);}
  .reader{flex:1;display:flex;justify-content:center;padding:56px 40px 40px;}
  article{width:100%;max-width:700px;}
  .chap-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin:0 0 10px;}
  article h1.chap-title{font-family:var(--serif);font-size:clamp(28px,4vw,38px);line-height:1.15;margin:0 0 32px;text-wrap:balance;font-weight:600;}
  .prose{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink);}
  .prose h2{font-family:var(--sans);font-size:20px;font-weight:600;margin:40px 0 14px;}
  .prose h3{font-family:var(--sans);font-size:16px;font-weight:600;margin:28px 0 10px;color:var(--ink);}
  .prose p{margin:0 0 16px;}
  .prose ul, .prose ol{margin:0 0 16px;padding-left:22px;}
  .prose li{margin:0 0 8px;}
  .prose li>ul, .prose li>ol{margin-top:8px;}
  .prose strong{font-weight:600;color:var(--ink);}
  .prose a{color:var(--accent);text-decoration-color:var(--line-strong);text-underline-offset:3px;}
  .prose a:hover{text-decoration-color:var(--accent);}
  .prose code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:.15em .4em;border-radius:5px;color:var(--accent);}
  .prose hr{border:none;border-top:1px solid var(--line);margin:36px 0;}
  .prose blockquote{margin:20px 0;padding:12px 18px;border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 8px 8px 0;font-family:var(--sans);font-size:14.5px;color:var(--ink);}
  .prose blockquote p{margin:0;}
  .prose blockquote p+p{margin-top:8px;}
  .code-wrap{margin:20px 0;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);}
  .code-wrap .lang{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--code-accent);background:var(--code-bg);padding:7px 14px 0;opacity:.7;}
  .prose pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:14px 18px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6;}
  .prose pre code{background:none;padding:0;color:inherit;font-size:inherit;}
  .table-wrap{margin:20px 0;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  .prose table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13.5px;}
  .prose th{text-align:left;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line-strong);white-space:nowrap;}
  .prose td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top;}
  .prose tr:last-child td{border-bottom:none;}
  .foot-nav{max-width:700px;width:100%;margin:48px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .nav-btn{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:border-color .15s ease, transform .1s ease;}
  .nav-btn:hover{border-color:var(--accent);}
  .nav-btn:active{transform:scale(.99);}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn:disabled:hover{border-color:var(--line);}
  .nav-btn .dir{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
  .nav-btn.next{text-align:right;align-items:flex-end;}
  .nav-btn .label{font-family:var(--sans);font-size:15px;font-weight:600;}
  .empty, .loading, .error{font-family:var(--mono);font-size:13px;color:var(--muted-2);padding:20px 0;}
  .error{color:var(--amber);}
  @media (max-width:820px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);}
    .topbar, .reader{padding-left:20px;padding-right:20px;}
  }
  @media (prefers-reduced-motion:reduce){.progress-fill, .nav-btn{transition:none;}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="kicker" id="brand-kicker">Cours</div>
      <h1 id="brand-title">Chargement…</h1>
    </div>
    <div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label"><span id="progress-text">0 / 0 lus</span><span id="progress-pct">0%</span></div>
    </div>
    <nav class="toc" id="toc"><div class="loading">Recherche des chapitres…</div></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <main>
    <div class="topbar">
      <span class="crumb">Chapitre <b id="crumb-num">–</b> / <span id="crumb-total">–</span></span>
      <button class="theme-toggle" id="theme-toggle" type="button">Clair / Sombre</button>
    </div>
    <div class="reader">
      <article>
        <p class="chap-eyebrow" id="chap-eyebrow"></p>
        <h1 class="chap-title" id="chap-title">Chargement du sommaire…</h1>
        <div class="prose" id="chap-body"></div>
        <div class="foot-nav" id="foot-nav" style="display:none;">
          <button class="nav-btn prev" id="btn-prev" type="button">
            <span class="dir">← Précédent</span>
            <span class="label" id="prev-label"></span>
          </button>
          <button class="nav-btn next" id="btn-next" type="button">
            <span class="dir">Suivant →</span>
            <span class="label" id="next-label"></span>
          </button>
        </div>
      </article>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var STORE_KEY = 'md-reader-progress::' + location.pathname;
  var THEME_KEY = 'md-reader-theme';

  var elToc = document.getElementById('toc');
  var elTitle = document.getElementById('chap-title');
  var elEyebrow = document.getElementById('chap-eyebrow');
  var elBody = document.getElementById('chap-body');
  var elCrumbNum = document.getElementById('crumb-num');
  var elCrumbTotal = document.getElementById('crumb-total');
  var elBrandTitle = document.getElementById('brand-title');
  var elSidebarFoot = document.getElementById('sidebar-foot');
  var footNav = document.getElementById('foot-nav');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var prevLabel = document.getElementById('prev-label');
  var nextLabel = document.getElementById('next-label');
  var progressFill = document.getElementById('progress-fill');
  var progressText = document.getElementById('progress-text');
  var progressPct = document.getElementById('progress-pct');

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {current:0, read:[]};
      var s = JSON.parse(raw);
      return {current: s.current||0, read: s.read||[]};
    }catch(e){ return {current:0, read:[]}; }
  }
  function saveState(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
  var state = loadState();

  marked.setOptions({ gfm:true, breaks:false });

  function renderMarkdown(md){
    var html = marked.parse(md);
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    wrap.querySelectorAll('table').forEach(function(t){
      var d = document.createElement('div');
      d.className = 'table-wrap';
      t.parentNode.insertBefore(d, t);
      d.appendChild(t);
    });
    wrap.querySelectorAll('pre').forEach(function(pre){
      var code = pre.querySelector('code');
      var lang = '';
      if(code && code.className){
        var m = code.className.match(/language-(\w+)/);
        if(m) lang = m[1];
      }
      var d = document.createElement('div');
      d.className = 'code-wrap';
      pre.parentNode.insertBefore(d, pre);
      if(lang){
        var l = document.createElement('div');
        l.className = 'lang';
        l.textContent = lang;
        d.appendChild(l);
      }
      d.appendChild(pre);
    });
    return wrap.innerHTML;
  }

  // Strip the leading H1 (rendered separately) and the trailing "---\n prev/next" nav block
  function splitChapter(raw){
    var lines = raw.replace(/\r\n/g, '\n').split('\n');
    var h1 = '';
    if(lines.length && /^#\s+/.test(lines[0])){
      h1 = lines.shift().replace(/^#\s+/, '').trim();
    }
    while(lines.length && lines[0].trim() === '') lines.shift();
    var body = lines.join('\n');
    var navSplit = body.lastIndexOf('\n---\n');
    if(navSplit !== -1) body = body.slice(0, navSplit);
    return { title: h1, body: body.trim() + '\n' };
  }

  function parseTitle(h1, fallbackNum){
    var m = h1.match(/^(\d+)\s*[—\-:]\s*(.+)$/);
    if(m) return { num: m[1], title: m[2] };
    return { num: fallbackNum, title: h1 };
  }

  // Discover chapter files from the directory listing this page is served from
  // (works with `python -m http.server`, which lists <a href="..."> entries for the current folder).
  function discoverChapters(){
    return fetch('./')
      .then(function(res){
        if(!res.ok) throw new Error('directory listing HTTP ' + res.status);
        return res.text();
      })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var links = Array.prototype.slice.call(doc.querySelectorAll('a[href]'));
        var files = links
          .map(function(a){ return decodeURIComponent(a.getAttribute('href')); })
          .filter(function(href){ return /^\d+-[^\/]+\.md$/i.test(href); })
          .sort(function(a, b){
            var na = parseInt(a.match(/^(\d+)/)[1], 10);
            var nb = parseInt(b.match(/^(\d+)/)[1], 10);
            return na - nb;
          });
        return files;
      });
  }

  function loadCourseTitle(){
    return fetch('./README.md')
      .then(function(res){ return res.ok ? res.text() : ''; })
      .then(function(md){
        var m = md.match(/^#\s+(.+)$/m);
        return m ? m[1].trim() : '';
      })
      .catch(function(){ return ''; });
  }

  var chapters = []; // { file, num, title, body, loaded }

  function buildToc(){
    elToc.innerHTML = '';
    chapters.forEach(function(ch, i){
      var btn = document.createElement('button');
      btn.className = 'toc-item';
      btn.type = 'button';
      btn.dataset.idx = i;
      btn.innerHTML = '<span class="n">'+ch.num+'</span><span class="t">'+ch.title+'</span><span class="check"></span>';
      btn.addEventListener('click', function(){ goTo(i); });
      elToc.appendChild(btn);
    });
  }

  function updateProgressUI(){
    var n = state.read.length, total = chapters.length;
    var pct = total ? Math.round((n/total)*100) : 0;
    progressFill.style.width = pct + '%';
    progressText.textContent = n + ' / ' + total + ' lus';
    progressPct.textContent = pct + '%';
  }

  function updateTocUI(){
    elToc.querySelectorAll('.toc-item').forEach(function(el){
      var i = Number(el.dataset.idx);
      el.classList.toggle('active', i === state.current);
      el.classList.toggle('read', state.read.indexOf(i) !== -1);
    });
  }

  function ensureLoaded(i){
    var ch = chapters[i];
    if(ch.loaded) return Promise.resolve(ch);
    return fetch(ch.file)
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(raw){
        var split = splitChapter(raw);
        var parsed = parseTitle(split.title, ch.num);
        ch.title = parsed.title;
        ch.body = split.body;
        ch.loaded = true;
        return ch;
      });
  }

  function render(i){
    var ch = chapters[i];
    elEyebrow.textContent = 'Chapitre ' + ch.num;
    elTitle.textContent = 'Chargement…';
    elBody.innerHTML = '<div class="loading">Chargement du chapitre…</div>';
    elCrumbNum.textContent = ch.num;

    ensureLoaded(i).then(function(){
      // buildToc() titles were placeholders; refresh once real title known
      var tocItem = elToc.querySelector('.toc-item[data-idx="'+i+'"] .t');
      if(tocItem) tocItem.textContent = ch.title;

      elTitle.textContent = ch.title;
      elBody.innerHTML = renderMarkdown(ch.body);

      footNav.style.display = 'grid';
      btnPrev.disabled = i === 0;
      btnNext.disabled = i === chapters.length - 1;
      prevLabel.textContent = i > 0 ? (chapters[i-1].num + ' — ' + chapters[i-1].title) : '';
      nextLabel.textContent = i < chapters.length - 1 ? (chapters[i+1].num + ' — ' + chapters[i+1].title) : 'Fin du module';

      if(state.read.indexOf(i) === -1) state.read.push(i);
      updateProgressUI();
      updateTocUI();
      saveState(state);
      window.scrollTo(0,0);
    }).catch(function(err){
      elTitle.textContent = ch.num + ' — erreur de chargement';
      elBody.innerHTML = '<div class="error">Impossible de charger '+ch.file+' (' + err.message + ')</div>';
    });
  }

  function goTo(i){
    if(i < 0 || i >= chapters.length) return;
    state.current = i;
    render(i);
  }

  btnPrev.addEventListener('click', function(){ goTo(state.current - 1); });
  btnNext.addEventListener('click', function(){ goTo(state.current + 1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') goTo(state.current + 1);
    if(e.key === 'ArrowLeft') goTo(state.current - 1);
  });

  var themeBtn = document.getElementById('theme-toggle');
  function applyTheme(t){
    if(t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem(THEME_KEY); }catch(e){}
  if(savedTheme) applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : (current === 'light' ? null : 'dark');
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next || ''); }catch(e){}
  });

  Promise.all([discoverChapters(), loadCourseTitle()]).then(function(results){
    var files = results[0];
    var courseTitle = results[1];

    if(!files.length){
      elToc.innerHTML = '<div class="empty">Aucun chapitre .md trouvé dans ce dossier.<br>Lance ce lecteur avec un serveur local pointé sur le dossier des chapitres (ex: <code>python -m http.server</code>).</div>';
      elTitle.textContent = 'Aucun chapitre trouvé';
      return;
    }

    chapters = files.map(function(file){
      var m = file.match(/^(\d+)-/);
      return { file: file, num: m ? m[1] : '', title: file.replace(/\.md$/,''), body: '', loaded: false };
    });

    elBrandTitle.textContent = courseTitle || document.title;
    elCrumbTotal.textContent = chapters.length;
    elSidebarFoot.textContent = location.pathname + ' · ' + chapters.length + ' chapitres · progression mémorisée';

    buildToc();
    if(state.current >= chapters.length) state.current = 0;
    updateProgressUI();
    render(state.current);
  }).catch(function(err){
    elToc.innerHTML = '<div class="error">Impossible de lister le dossier (' + err.message + ').<br><br>Ce lecteur a besoin d\'un serveur HTTP local (le listing de dossier de <code>python -m http.server</code>). Lance-le depuis ce dossier :<br><code>python -m http.server 8000</code><br>puis ouvre <code>http://localhost:8000/reader.html</code>.</div>';
    elTitle.textContent = 'Erreur';
  });
})();
</script>
</body>
</html>
