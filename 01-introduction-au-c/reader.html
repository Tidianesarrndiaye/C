<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur de cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --paper:#f4f3ec;
    --paper-2:#eeece2;
    --card:#faf9f3;
    --rule:#c9d6d2;
    --rule-strong:#aebdb6;
    --ink:#1f2a24;
    --ink-muted:#5b6b62;
    --ink-faint:#8a998f;
    --red:#b3321c;
    --red-soft:#f3ddd4;
    --code-bg:#20281f;
    --code-ink:#e4e6da;
    --code-accent:#e8b090;
    --shadow:0 1px 1px rgba(31,42,36,.05), 0 6px 18px -10px rgba(31,42,36,.28);
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --mono:'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --grid-op: .05;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#191c17; --paper-2:#14170f; --card:#20241d;
      --rule:#333c30; --rule-strong:#454f40;
      --ink:#e7e6da; --ink-muted:#a7ab98; --ink-faint:#6c7566;
      --red:#e2694c; --red-soft:#3a241d;
      --code-bg:#0f130d; --code-ink:#dfe3d4; --code-accent:#e8b090;
      --shadow:0 1px 1px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
      --grid-op: .08;
    }
  }
  :root[data-theme="dark"]{
    --paper:#191c17; --paper-2:#14170f; --card:#20241d;
    --rule:#333c30; --rule-strong:#454f40;
    --ink:#e7e6da; --ink-muted:#a7ab98; --ink-faint:#6c7566;
    --red:#e2694c; --red-soft:#3a241d;
    --code-bg:#0f130d; --code-ink:#dfe3d4; --code-accent:#e8b090;
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
    --grid-op: .08;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;}
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:inherit; background-size:inherit; background-position:inherit;
    opacity:var(--grid-op);
    pointer-events:none;
  }
  body > .shell{position:relative; z-index:1;}
  body > *:not(.shell){ }

  .shell{
    display:grid;
    grid-template-columns:minmax(0,1fr) 84px;
    min-height:100vh;
    max-width:1180px;
    margin:0 auto;
  }

  /* ---------- Reading column ---------- */
  main{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:26px 48px 18px;
  }
  .topbar .course-name{
    font-family:var(--serif);
    font-size:15px;
    font-style:italic;
    color:var(--ink-muted);
  }
  .theme-toggle{
    margin-left:auto;
    font-family:var(--serif);
    font-size:13px;
    font-style:italic;
    color:var(--ink-muted);
    background:none;
    border:none;
    border-bottom:1px solid var(--rule-strong);
    padding:2px 0;
    cursor:pointer;
  }
  .theme-toggle:hover{color:var(--red); border-color:var(--red);}

  .reader{
    flex:1;
    padding:10px 48px 60px;
  }
  article{
    max-width:660px;
  }
  .chap-head{
    display:flex;
    align-items:flex-start;
    gap:22px;
    margin-bottom:38px;
    border-bottom:1px solid var(--rule-strong);
    padding-bottom:26px;
  }
  .chap-folio{
    font-family:var(--mono);
    font-size:52px;
    font-weight:500;
    line-height:1;
    color:var(--ink-faint);
    letter-spacing:-.02em;
    padding-top:6px;
  }
  article h1.chap-title{
    font-family:var(--serif);
    font-size:clamp(28px,3.6vw,38px);
    font-weight:600;
    line-height:1.18;
    margin:0;
    text-wrap:balance;
    flex:1;
  }

  .prose{
    font-size:18px;
    line-height:1.75;
    color:var(--ink);
    max-width:66ch;
  }
  .prose h2{
    font-family:var(--serif);
    font-weight:600;
    font-style:italic;
    font-size:23px;
    margin:38px 0 12px;
    color:var(--ink);
  }
  .prose h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:18px;
    margin:26px 0 8px;
  }
  .prose p{margin:0 0 16px;}
  .prose ul, .prose ol{margin:0 0 16px;padding-left:24px;}
  .prose li{margin:0 0 8px;}
  .prose li>ul, .prose li>ol{margin-top:8px;}
  .prose strong{font-weight:600;}
  .prose a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px;}
  .prose a:hover{text-decoration-color:var(--red); color:var(--red);}
  .prose code{
    font-family:var(--mono);
    font-size:.82em;
    background:var(--paper-2);
    padding:.1em .35em;
    border-radius:3px;
    color:var(--ink);
    border:1px solid var(--rule);
  }
  .prose hr{border:none;border-top:1px solid var(--rule);margin:34px 0;}

  .prose blockquote{
    margin:22px 0;
    padding:4px 0 4px 20px;
    border-left:2px solid var(--red);
    font-style:italic;
    color:var(--ink-muted);
    font-size:16.5px;
  }
  .prose blockquote p{margin:0;}
  .prose blockquote p+p{margin-top:8px;}

  .code-wrap{
    margin:22px 0;
    border-radius:3px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .code-wrap .lang{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.04em;
    color:var(--code-accent);
    background:var(--code-bg);
    padding:8px 16px 0;
    opacity:.65;
  }
  .prose pre{
    margin:0;
    background:var(--code-bg);
    color:var(--code-ink);
    padding:16px 18px 18px;
    overflow-x:auto;
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.65;
  }
  .prose pre code{background:none;border:none;padding:0;color:inherit;font-size:inherit;}

  .table-wrap{margin:22px 0;overflow-x:auto;}
  .prose table{border-collapse:collapse;width:100%;font-family:var(--serif);font-size:15.5px;}
  .prose th{
    text-align:left;
    font-weight:600;
    font-style:italic;
    color:var(--ink-muted);
    padding:8px 16px 8px 0;
    border-bottom:1px solid var(--rule-strong);
    white-space:nowrap;
  }
  .prose td{
    padding:9px 16px 9px 0;
    border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  .prose tr:last-child td{border-bottom:1px solid var(--rule-strong);}

  .foot-nav{
    max-width:660px;
    margin:52px 0 0;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    padding-top:22px;
    border-top:1px solid var(--rule-strong);
  }
  .nav-btn{
    display:flex;
    flex-direction:column;
    gap:5px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    padding:0;
    max-width:280px;
  }
  .nav-btn.next{align-items:flex-end;text-align:right;margin-left:auto;}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;}
  .nav-btn .dir{
    font-family:var(--serif);
    font-style:italic;
    font-size:13.5px;
    color:var(--red);
  }
  .nav-btn .label{
    font-size:16px;
    font-weight:500;
    line-height:1.35;
    border-bottom:1px solid transparent;
  }
  .nav-btn:hover:not(:disabled) .label{border-bottom-color:var(--ink);}

  .empty, .loading, .error{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-muted);padding:20px 0;}
  .error{color:var(--red);}

  /* ---------- Tab rail (sidebar as index-card tabs) ---------- */
  .tabrail{
    position:sticky; top:0;
    height:100vh;
    overflow-y:auto;
    padding:26px 0 20px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:3px;
    scrollbar-width:thin;
  }
  .rail-head{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-family:var(--serif);
    font-style:italic;
    font-size:12.5px;
    color:var(--ink-faint);
    margin-bottom:16px;
    padding-right:2px;
    white-space:nowrap;
  }
  .tab{
    display:flex;
    align-items:center;
    gap:7px;
    width:66px;
    padding:8px 10px;
    background:var(--card);
    border:1px solid var(--rule);
    border-right:none;
    border-radius:6px 0 0 6px;
    cursor:pointer;
    font-family:var(--mono);
    color:var(--ink-muted);
    transition:width .12s ease, background .12s ease, color .12s ease;
    position:relative;
  }
  .tab:hover{width:74px; color:var(--ink);}
  .tab .num{font-size:13px; font-weight:500;}
  .tab .dot{
    width:6px; height:6px; border-radius:50%;
    border:1.3px solid var(--rule-strong);
    margin-left:auto;
    flex:none;
  }
  .tab.read .dot{background:var(--red); border-color:var(--red);}
  .tab.active{
    width:84px;
    background:var(--paper);
    border-color:var(--rule-strong);
    color:var(--red);
    box-shadow:var(--shadow);
    z-index:2;
  }
  .tab.active .num{color:var(--red); font-weight:600;}
  .tab.active .dot{border-color:var(--red);}

  .rail-foot{
    margin-top:auto;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-faint);
    padding-top:14px;
    white-space:nowrap;
  }

  @media (max-width:860px){
    .shell{grid-template-columns:1fr; max-width:100%;}
    .tabrail{
      position:static; height:auto; flex-direction:row; flex-wrap:wrap;
      align-items:flex-start; padding:16px 20px; gap:6px;
    }
    .rail-head, .rail-foot{display:none;}
    .tab{border-radius:6px; border-right:1px solid var(--rule); width:auto;}
    .tab.active{width:auto;}
    .topbar, .reader{padding-left:20px; padding-right:20px;}
    .chap-folio{font-size:34px;}
  }
  @media (prefers-reduced-motion:reduce){ .tab{transition:none;} }
</style>
</head>
<body>

<div class="shell">
  <main>
    <div class="topbar">
      <span class="course-name" id="course-name">Chargement…</span>
      <button class="theme-toggle" id="theme-toggle" type="button">clair / sombre</button>
    </div>
    <div class="reader">
      <article>
        <div class="chap-head">
          <div class="chap-folio" id="chap-folio">–</div>
          <h1 class="chap-title" id="chap-title">Chargement du sommaire…</h1>
        </div>
        <div class="prose" id="chap-body"></div>
        <div class="foot-nav" id="foot-nav" style="display:none;">
          <button class="nav-btn prev" id="btn-prev" type="button">
            <span class="dir">précédent</span>
            <span class="label" id="prev-label"></span>
          </button>
          <button class="nav-btn next" id="btn-next" type="button">
            <span class="dir">suivant</span>
            <span class="label" id="next-label"></span>
          </button>
        </div>
      </article>
    </div>
  </main>

  <aside class="tabrail">
    <div class="rail-head" id="rail-head">sommaire</div>
    <div id="tabs"></div>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var STORE_KEY = 'md-reader-progress::' + location.pathname;
  var THEME_KEY = 'md-reader-theme';

  var elTabs = document.getElementById('tabs');
  var elTitle = document.getElementById('chap-title');
  var elFolio = document.getElementById('chap-folio');
  var elBody = document.getElementById('chap-body');
  var elCourseName = document.getElementById('course-name');
  var elRailHead = document.getElementById('rail-head');
  var elRailFoot = document.getElementById('rail-foot');
  var footNav = document.getElementById('foot-nav');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var prevLabel = document.getElementById('prev-label');
  var nextLabel = document.getElementById('next-label');

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {current:0, read:[]};
      var s = JSON.parse(raw);
      return {current: s.current||0, read: s.read||[]};
    }catch(e){ return {current:0, read:[]}; }
  }
  function saveState(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
  var state = loadState();

  marked.setOptions({ gfm:true, breaks:false });

  function renderMarkdown(md){
    var html = marked.parse(md);
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    wrap.querySelectorAll('table').forEach(function(t){
      var d = document.createElement('div');
      d.className = 'table-wrap';
      t.parentNode.insertBefore(d, t);
      d.appendChild(t);
    });
    wrap.querySelectorAll('pre').forEach(function(pre){
      var code = pre.querySelector('code');
      var lang = '';
      if(code && code.className){
        var m = code.className.match(/language-(\w+)/);
        if(m) lang = m[1];
      }
      var d = document.createElement('div');
      d.className = 'code-wrap';
      pre.parentNode.insertBefore(d, pre);
      if(lang){
        var l = document.createElement('div');
        l.className = 'lang';
        l.textContent = lang;
        d.appendChild(l);
      }
      d.appendChild(pre);
    });
    return wrap.innerHTML;
  }

  function splitChapter(raw){
    var lines = raw.replace(/\r\n/g, '\n').split('\n');
    var h1 = '';
    if(lines.length && /^#\s+/.test(lines[0])){
      h1 = lines.shift().replace(/^#\s+/, '').trim();
    }
    while(lines.length && lines[0].trim() === '') lines.shift();
    var body = lines.join('\n');
    var navSplit = body.lastIndexOf('\n---\n');
    if(navSplit !== -1) body = body.slice(0, navSplit);
    return { title: h1, body: body.trim() + '\n' };
  }

  function parseTitle(h1, fallbackNum){
    var m = h1.match(/^(\d+)\s*[—\-:]\s*(.+)$/);
    if(m) return { num: m[1], title: m[2] };
    return { num: fallbackNum, title: h1 };
  }

  function discoverChapters(){
    return fetch('./')
      .then(function(res){
        if(!res.ok) throw new Error('directory listing HTTP ' + res.status);
        return res.text();
      })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var links = Array.prototype.slice.call(doc.querySelectorAll('a[href]'));
        var files = links
          .map(function(a){ return decodeURIComponent(a.getAttribute('href')); })
          .filter(function(href){ return /^\d+-[^\/]+\.md$/i.test(href); })
          .sort(function(a, b){
            var na = parseInt(a.match(/^(\d+)/)[1], 10);
            var nb = parseInt(b.match(/^(\d+)/)[1], 10);
            return na - nb;
          });
        return files;
      });
  }

  function loadCourseTitle(){
    return fetch('./README.md')
      .then(function(res){ return res.ok ? res.text() : ''; })
      .then(function(md){
        var m = md.match(/^#\s+(.+)$/m);
        return m ? m[1].trim() : '';
      })
      .catch(function(){ return ''; });
  }

  var chapters = [];

  function buildTabs(){
    elTabs.innerHTML = '';
    chapters.forEach(function(ch, i){
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.dataset.idx = i;
      btn.title = ch.title;
      btn.innerHTML = '<span class="num">'+ch.num+'</span><span class="dot"></span>';
      btn.addEventListener('click', function(){ goTo(i); });
      elTabs.appendChild(btn);
    });
  }

  function updateTabsUI(){
    elTabs.querySelectorAll('.tab').forEach(function(el){
      var i = Number(el.dataset.idx);
      el.classList.toggle('active', i === state.current);
      el.classList.toggle('read', state.read.indexOf(i) !== -1);
    });
  }

  function ensureLoaded(i){
    var ch = chapters[i];
    if(ch.loaded) return Promise.resolve(ch);
    return fetch(ch.file)
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(raw){
        var split = splitChapter(raw);
        var parsed = parseTitle(split.title, ch.num);
        ch.title = parsed.title;
        ch.body = split.body;
        ch.loaded = true;
        return ch;
      });
  }

  function render(i){
    var ch = chapters[i];
    elFolio.textContent = ch.num;
    elTitle.textContent = 'Chargement…';
    elBody.innerHTML = '<div class="loading">chargement du chapitre…</div>';

    ensureLoaded(i).then(function(){
      var tab = elTabs.querySelector('.tab[data-idx="'+i+'"]');
      if(tab) tab.title = ch.title;

      elTitle.textContent = ch.title;
      elBody.innerHTML = renderMarkdown(ch.body);

      footNav.style.display = 'flex';
      btnPrev.disabled = i === 0;
      btnNext.disabled = i === chapters.length - 1;
      prevLabel.textContent = i > 0 ? (chapters[i-1].num + ' — ' + chapters[i-1].title) : '';
      nextLabel.textContent = i < chapters.length - 1 ? (chapters[i+1].num + ' — ' + chapters[i+1].title) : 'fin du module';

      if(state.read.indexOf(i) === -1) state.read.push(i);
      updateTabsUI();
      saveState(state);
      elRailFoot.textContent = state.read.length + ' / ' + chapters.length + ' lus';
      window.scrollTo(0,0);
    }).catch(function(err){
      elTitle.textContent = ch.num + ' — erreur de chargement';
      elBody.innerHTML = '<div class="error">impossible de charger '+ch.file+' (' + err.message + ')</div>';
    });
  }

  function goTo(i){
    if(i < 0 || i >= chapters.length) return;
    state.current = i;
    render(i);
  }

  btnPrev.addEventListener('click', function(){ goTo(state.current - 1); });
  btnNext.addEventListener('click', function(){ goTo(state.current + 1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') goTo(state.current + 1);
    if(e.key === 'ArrowLeft') goTo(state.current - 1);
  });

  var themeBtn = document.getElementById('theme-toggle');
  function applyTheme(t){
    if(t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem(THEME_KEY); }catch(e){}
  if(savedTheme) applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : (current === 'light' ? null : 'dark');
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next || ''); }catch(e){}
  });

  Promise.all([discoverChapters(), loadCourseTitle()]).then(function(results){
    var files = results[0];
    var courseTitle = results[1];

    if(!files.length){
      elTabs.innerHTML = '';
      elRailHead.textContent = '—';
      elTitle.textContent = 'Aucun chapitre trouvé';
      elBody.innerHTML = '<div class="empty">Aucun fichier .md numéroté dans ce dossier.<br>Lance ce lecteur avec un serveur local pointé sur le dossier des chapitres (ex: <code>python -m http.server</code>).</div>';
      return;
    }

    chapters = files.map(function(file){
      var m = file.match(/^(\d+)-/);
      return { file: file, num: m ? m[1] : '', title: file.replace(/\.md$/,''), body: '', loaded: false };
    });

    elCourseName.textContent = courseTitle || document.title;
    elRailHead.textContent = chapters.length + ' chapitres';
    elRailFoot.textContent = (state.read.length) + ' lus';

    buildTabs();
    if(state.current >= chapters.length) state.current = 0;
    render(state.current);
  }).catch(function(err){
    elRailHead.textContent = 'erreur';
    elTitle.textContent = 'Erreur';
    elBody.innerHTML = '<div class="error">Impossible de lister le dossier (' + err.message + ').<br><br>Ce lecteur a besoin d\'un serveur HTTP local (le listing de dossier de <code>python -m http.server</code>). Lance-le depuis ce dossier :<br><code>python -m http.server 8329</code><br>puis ouvre <code>http://localhost:8329/reader.html</code>.</div>';
  });
})();
</script>
</body>
</html>
